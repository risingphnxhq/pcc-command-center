<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCC — Build Control</title>
<style>body{margin:0;background:#05080c;color:#f4efe5;font:14px Arial,sans-serif}.shell{max-width:1200px;margin:auto;padding:20px}.card{border:1px solid #55472e;background:#0d151f;padding:18px;margin:12px 0}h1,h2{margin:.3em 0}label{display:block;margin:10px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;background:#050a10;color:#f4efe5;border:1px solid #3c4650}textarea{min-height:160px}button{cursor:pointer;border-color:#8a7040}.status{padding:8px;border:1px solid #55472e}.ok{color:#49d391}.bad{color:#ea7474}pre{white-space:pre-wrap;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="shell"><h1>PCC Build Control</h1><div id="status" class="status">AUTHENTICATION REQUIRED</div>
<div class="grid"><section class="card"><h2>Prime Mason Session</h2><form id="login"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Authenticate</button></form><p><a href="boas-control.html">BOAS Control</a> · <a href="systems-console.html">Systems Console</a></p></section>
<section class="card"><h2>Build Register</h2><button id="list" disabled>List Build Controls</button><pre id="listout">No read executed.</pre></section></div>
<section class="card"><h2>Create Build Control</h2><p>Prime Mason only. BOAS admission must already exist.</p><form id="create">
<label>Build Control ID<input id="bcid" required></label><label>System Stream ID<input id="stream" required></label><label>Version<input id="version" required></label><label>Title<input id="title" required></label><label>Objective<textarea id="objective" required></textarea></label><label>Exact Delta<textarea id="delta" required></textarea></label><label>Controlling PSC IDs (one per line)<textarea id="pscs" required></textarea></label><button disabled>Create Governed Build Control</button></form></section>
<section class="card"><h2>Response / Receipt</h2><pre id="out">No operation executed.</pre></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
(()=>{"use strict";const U="https://oyjmpbuxvfxusmbouldi.supabase.co",K="sb_publishable_rwTE4QRlQkzr0R0f5t5ylA_a9zuj0eE",F="pcc-build-control-v1",P="277a74df-5c86-4a16-8e00-1636dad052db",c=window.supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.getElementById(x),buttons=[$("list"),$("create").querySelector("button")];
function ready(v,t,b=false){$("status").textContent=t;$("status").className="status "+(v?"ok":b?"bad":"");buttons.forEach(x=>x.disabled=!v)}
async function call(action,payload={}){const {data:{session}}=await c.auth.getSession();if(!session?.access_token)throw Error("AUTHENTICATED_SESSION_REQUIRED");const r=await fetch(U+"/functions/v1/"+F,{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:K,"Content-Type":"application/json"},body:JSON.stringify({action,payload}),cache:"no-store"}),b=await r.json().catch(()=>({error:"INVALID_BUILD_CONTROL_RESPONSE"}));if(!r.ok)throw Object.assign(Error(b.error||"HTTP_"+r.status),{body:b});return b}
async function refresh(){const {data:{session}}=await c.auth.getSession();if(!session?.user?.id)return ready(false,"AUTHENTICATION REQUIRED");if(session.user.id!==P)return ready(false,"PRIME MASON REQUIRED",true);ready(true,"PRIME MASON VERIFIED")}
$("login").onsubmit=async e=>{e.preventDefault();const {error}=await c.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("out").textContent=error.message;ready(false,"AUTHENTICATION FAILED",true)}else await refresh()};
$("list").onclick=async()=>{try{$("listout").textContent=JSON.stringify(await call("LIST",{}),null,2)}catch(e){$("listout").textContent=JSON.stringify(e.body||{error:e.message},null,2)}};
$("create").onsubmit=async e=>{e.preventDefault();const p={build_control_id:$("bcid").value.trim(),system_stream_id:$("stream").value.trim(),version:$("version").value.trim(),title:$("title").value.trim(),objective:$("objective").value.trim(),exact_delta:$("delta").value.trim(),controlling_psc_ids:$("pscs").value.split(/\n/).map(x=>x.trim()).filter(Boolean)};try{$("out").textContent=JSON.stringify(await call("CREATE",p),null,2)}catch(x){$("out").textContent=JSON.stringify(x.body||{error:x.message},null,2)}};
c.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh()})();
</script><script src="nace-runtime.js?v=20261001f" defer></script></body></html>
