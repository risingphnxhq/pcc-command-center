<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>PCC · Account recovery</title>
<style>body{margin:0;background:#080d14;color:#f4efe5;font:16px/1.6 system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:30px;border:1px solid #c6a15b}h1{font-size:26px}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;margin-top:6px}input{background:#111b28;border:1px solid #777;color:inherit}button{background:#c6a15b;color:#080d14;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#e2c27f}#status{min-height:48px}[hidden]{display:none!important}@media(max-width:540px){main{margin:24px 16px;padding:22px}}</style>
</head><body><main><p>RISING PHOENIX ENTERPRISES</p><h1>Recover your PCC account</h1><p id="status" role="status" aria-live="polite">Opening account recovery…</p>
<form id="requestForm" hidden><label for="email">Account email</label><input id="email" type="email" autocomplete="username" required><button id="requestButton" type="submit">Send recovery email</button></form>
<form id="passwordForm" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><p>Use at least 12 characters.</p><button id="saveButton" type="submit">Save new password</button></form>
<p><a href="index.html">Return to PCC</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="recover-account.js?v=20261002a"></script></body></html>
