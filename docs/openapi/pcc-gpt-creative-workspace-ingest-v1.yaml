openapi: 3.1.0
info:
  title: PCC GPT Creative Workspace Intake
  version: 1.0.0
  description: Submit writing and creative-work metadata to PCC for held triage. PCC resolves a PSC-backed producer and viewing-placement plan in the receipt; it does not dispatch, approve, render, or publish. Authenticate with a dedicated pccwi_ key issued by the PCC Workspace Intake page.
servers:
  - url: https://oyjmpbuxvfxusmbouldi.supabase.co/functions/v1/pcc-workspace-ingest-v1
paths:
  /:
    post:
      operationId: submitCreativeWorkToPCC
      summary: Submit creative work to PCC (or finalize an asset upload)
      security:
        - PCCGPTIntakeBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SubmitRequest'
                - $ref: '#/components/schemas/FinalizeRequest'
      responses:
        '200':
          description: PCC intake receipt or asset upload instructions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { description: Invalid request }
        '401': { description: Missing or invalid access token }
        '403': { description: No eligible PCC workspace binding }
        '409': { description: Idempotency conflict or asset not uploaded }
        '413': { description: Request or asset exceeds intake limits }
        '422': { description: Asset integrity verification failed }
components:
  securitySchemes:
    PCCGPTIntakeBearer:
      type: http
      scheme: bearer
      bearerFormat: Dedicated pccwi_ workspace intake key
  schemas:
    SubmitRequest:
      type: object
      required: [operation, idempotency_key, content_kind, title]
      properties:
        operation: { const: submit }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        content_kind:
          type: string
          enum: [BOOK, AD, REEL, SHORT, EPISODE, SERIES, IMAGE, VIDEO, AUDIO, DOCUMENT, CONCEPT, OTHER]
        requested_operation:
          type: string
          enum: [CAPTURE, AUTHOR, PRODUCE, DISTRIBUTE]
          default: PRODUCE
          description: Requested next action. This is intent only; execution remains gated.
        placements:
          type: array
          maxItems: 4
          description: Explicit viewer destinations. No destination is inferred from free-text target labels.
          items:
            oneOf:
              - type: object
                required: [destination_type, destination_id]
                properties:
                  destination_type: { const: PSN_CATALOG }
                  destination_id: { const: phnx_phanimation }
                  placement_format: { type: string, maxLength: 80 }
              - type: object
                required: [destination_type, channel_key]
                properties:
                  destination_type: { const: SPIDER_YOUTUBE }
                  channel_key:
                    type: string
                    enum: [phoenix_goldmind, valarian_shadow, shadowframe, phnx_studios, phnx_sports, rpe, phnx_kids, phnx_kitchen, phnx_faceless_reels, phoenix_gold_words]
                  placement_format: { type: string, maxLength: 80 }
        title: { type: string, maxLength: 500 }
        body_text:
          type: string
          description: Text or a bounded segment such as a chapter, screenplay, caption, or creative brief.
        content_document:
          type: object
          additionalProperties: true
        target_system: { type: string }
        target_channel: { type: string }
        source_metadata:
          type: object
          description: GPT/conversation/model/PSC references are provenance hints, not approval evidence.
          additionalProperties: true
        assets:
          type: array
          maxItems: 10
          description: Manifest for binary objects uploaded separately to the returned private signed-upload URL.
          items:
            type: object
            required: [file_name, mime_type, size_bytes, sha256]
            properties:
              file_name: { type: string, maxLength: 255 }
              mime_type: { type: string }
              size_bytes: { type: integer, minimum: 1, maximum: 20971520 }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              role: { type: string }
    FinalizeRequest:
      type: object
      required: [operation, intake_id]
      properties:
        operation: { const: finalize }
        intake_id: { type: string, format: uuid }
