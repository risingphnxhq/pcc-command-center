name: Corporate cognition release checks
on:
  pull_request:
    paths:
      - 'command-floor.html'
      - 'nace-cognition.js'
      - 'nace-runtime.js'
      - 'supabase/functions/pcc-nace-conversation/**'
      - 'db/pcc_nace_live_conversation.sql'
      - 'office-work.html'
      - 'office.html'
      - 'supabase/functions/pcc-voice-realtime-session/**'
      - 'db/corporate_voice_office_conversation_turns.sql'
      - 'supabase/functions/pcc-corporate-office-work/**'
      - 'tests/cognition-release.test.mjs'
      - '.github/workflows/cognition-release.yml'
  workflow_dispatch:
jobs:
  cognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/cognition-release.test.mjs
