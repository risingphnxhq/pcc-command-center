name: PCC Supabase Migration Guard

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'build-control.html'
      - 'registry.html'
      - 'execution.html'
      - 'nhce-monitor.html'
      - 'pcc-systems-read-runtime.js'
      - 'supabase/functions/pcc-systems-read-v1/**'
      - 'supabase/functions/pcc-prime-systems-executor-v1/**'
      - '.github/workflows/pcc-supabase-migration-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcc-migration-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PCC service-authority migration invariants
        shell: bash
        run: |
          set -euo pipefail
          A="supabase/migrations/20261004_pcc_service_authority_binding_v1.sql"
          P="supabase/migrations/20261004_pcc_service_execution_provenance_v1.sql"
          test -f "$A"; test -f "$P"
          grep -Fq "PCC_PRIME_SYSTEMS_EXECUTOR" "$A"
          grep -Fq "PRIME_MASON_EXECUTOR" "$A"
          grep -Fq "array['0','1','2','3']" "$A"
          grep -Fq "'gate4','DENIED'" "$A"
          grep -Fq "'gate5','DENIED'" "$A"
          grep -Fq "service_execution_receipts" "$P"
          grep -Fq "SERVICE_EXECUTION_RECEIPTS_IMMUTABLE" "$P"
          grep -Fq "performed_by service principal is distinct from authority_owner actor" "$P"
          if grep -Eq "array\[[^]]*'4'|array\[[^]]*'5'" "$A"; then exit 1; fi
          if grep -Eq "PRIME_MASON_ACCOUNT.*SERVICE_PRINCIPAL|SERVICE_PRINCIPAL.*PRIME_MASON_ACCOUNT" "$A"; then exit 1; fi
  pcc-prime-continuity-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded Prime to Foreman continuity delegation
        shell: bash
        run: |
          set -euo pipefail
          E="supabase/functions/pcc-prime-systems-executor-v1/index.ts"
          test -f "$E"
          grep -Fq 'PCC_PRIME_SYSTEMS_EXECUTOR' "$E"
          grep -Fq 'pcc-prime-systems-executor' "$E"
          grep -Fq 'DISPATCH_CONTINUITY_TEST' "$E"
          grep -Fq 'pcc_foreman_gate2_dispatch_v0' "$E"
          grep -Fq 'IDEMPOTENCY_KEY_REQUIRED' "$E"
          grep -Fq 'gate4:"DENIED"' "$E"
          grep -Fq 'gate5:"DENIED"' "$E"
          if grep -Fq 'SEND_CONTINUITY' "$E"; then
            echo "Prime executor must delegate continuity; it must not own SEND_CONTINUITY."
            exit 1
          fi
          echo "PCC Prime continuity delegation PASS."
