name: PCC PSC-D Containment Tests
on:
  pull_request:
    paths:
      - 'pcc-psc-d-ack-runtime.js'
      - 'tests/pcc-psc-d-ack-runtime.test.cjs'
      - '.github/workflows/pcc-psc-d-containment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check pcc-psc-d-ack-runtime.js
      - name: Fail-closed regression tests
        run: node --test tests/pcc-psc-d-ack-runtime.test.cjs
